name: Test Build Canary with openssl1
on:
  workflow_dispatch:
  push:
    branches:
      - canary
      
jobs:
  get-version:
    name: get latest version number
    runs-on: ubuntu-latest
    outputs:
      CUR_VERSION: ${{steps.get-version.outputs.CUR_VERSION}}
    steps:
    - uses: actions/checkout@v3
      with:
        ref: VERSION_CONTROL
        fetch-depth: 1
        path: version_control
    - name: get version
      id: get-version
      run: |
          #获取当前版本号
          pre_version=$(cat version_control/VERSION | grep "PREFEX" | sed 's/PREFEX=\(.*\)/\1/')
          cur_version=$(cat version_control/VERSION | grep "CUR_VERS" | sed 's/CUR_VERS=\(.*\)/\1/')
          echo "CUR_VERSION=$pre_version$cur_version" >> $GITHUB_OUTPUT

  build: 
    needs: get-version
    strategy:
      matrix:
        goarch: [x86_64, powerpc64le, mipsel, mips, i686, aarch64, armv7l, mips-sf, mipsel-sf]
      fail-fast: false
    runs-on: ubuntu-latest
    env:
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v3
      - uses: actions/checkout@v3
        with:
          ref: BUILD-DEPENDENCIES
          fetch-depth: 1
          path: dependencies
      - name: build-smartdns-openssl1.1.1
        run: |
          sudo timedatectl set-timezone "Asia/Shanghai"
          cd ${{ github.workspace }}
          mkdir -p ${{ github.workspace }}/build
          sed -i "s/VER=.*/VER=${{needs.get-version.outputs.CUR_VERSION}}/" ${{ github.workspace }}/package/build-pkg.sh
          mkdir -p ${{ github.workspace }}/openssl
          tar -zxvf ./dependencies/openssl-1.1.1w.tar.gz --strip-components 1 -C openssl
          rm docker-openssl.sh || true
          cat >> docker-openssl.sh << EOF
          apk add perl make coreutils tar pkgconfig dpkg binutils autoconf zig
          mkdir -p /usr/local/zig/bin
          if [ "$GOARCH" == "armv7" ] || [ "$GOARCH" == "armv7l" ] ;then
            printf '#!/bin/sh\nexec zig cc -target arm-linux-musleabihf "\044@"\n' > /usr/local/zig/bin/gcc
            printf '#!/bin/sh\nexec zig c++ -target arm-linux-musleabihf "\044@"\n' > /usr/local/zig/bin/g++
          elif [ "$GOARCH" == "mips" ] ;then
            printf '#!/bin/sh\nexec zig cc -target mips-linux-musleabi  "\044@"\n' > /usr/local/zig/bin/gcc
            printf '#!/bin/sh\nexec zig c++ -target mips-linux-musleabi "\044@"\n' > /usr/local/zig/bin/g++
          elif [ "$GOARCH" == "mipsel" ] ;then
            printf '#!/bin/sh\nexec zig cc -target mipsel-linux-musleabi "\044@"\n' > /usr/local/zig/bin/gcc
            printf '#!/bin/sh\nexec zig c++ -target mipsel-linux-musleabi "\044@"\n' > /usr/local/zig/bin/g++
          elif [ "$GOARCH" == "mips-sf" ] ;then
            printf '#!/bin/sh\nexec zig cc -target mips-linux-musleabi -msoft-float "\044@"\n' > /usr/local/zig/bin/gcc
            printf '#!/bin/sh\nexec zig c++ -target mips-linux-musleabi -msoft-float "\044@"\n' > /usr/local/zig/bin/g++
          elif [ "$GOARCH" == "mipsel-sf" ] ;then
            printf '#!/bin/sh\nexec zig cc -target mipsel-linux-musleabi -msoft-float "\044@"\n' > /usr/local/zig/bin/gcc
            printf '#!/bin/sh\nexec zig c++ -target mipsel-linux-musleabi -msoft-float "\044@"\n' > /usr/local/zig/bin/g++
          elif [ "$GOARCH" == "i686" ] ;then
            printf '#!/bin/sh\nexec zig cc -target x86-linux-musl "\044@"\n' > /usr/local/zig/bin/gcc
            printf '#!/bin/sh\nexec zig c++ -target x86-linux-musl "\044@"\n' > /usr/local/zig/bin/g++
          else
            printf '#!/bin/sh\nexec zig cc -target $GOARCH-linux-musl "\044@"\n' > /usr/local/zig/bin/gcc
            printf '#!/bin/sh\nexec zig c++ -target $GOARCH-linux-musl "\044@"\n' > /usr/local/zig/bin/g++
          fi
          cp /usr/local/zig/bin/gcc /usr/local/zig/bin/cc
          cp /usr/local/zig/bin/gcc /usr/local/zig/bin/clang
          cp /usr/local/zig/bin/g++ /usr/local/zig/bin/c++
          cp /usr/local/zig/bin/g++ /usr/local/zig/bin/clang++
          printf '#!/bin/sh\nexec zig ar "\044@"\n' > /usr/local/zig/bin/ar
          chmod +x /usr/local/zig/bin/*
          export PATH=/usr/local/zig/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          export CC=gcc
          cd /workdir/openssl
          if [ "$GOARCH" == "mipsel" ] || [ "$GOARCH" == "mips" ] || [ "$GOARCH" == "mips-sf" ] || [ "$GOARCH" == "mipsel-sf" ] ;then
            ./Configure no-tests linux-mips32
          elif [ "$GOARCH" == "mips64el" ] || [ "$GOARCH" == "mips64" ] ;then
            ./Configure no-tests linux-mips64
          elif [ "$GOARCH" == "i686" ] ;then
            ./Configure no-tests linux-x86
          elif [ "$GOARCH" == "powerpc64le" ] ;then
            ./Configure no-tests linux-ppc64le
          elif [ "$GOARCH" == "armv7" ] || [ "$GOARCH" == "armv7l" ] ;then
            ./Configure no-tests linux-armv4
          else
            ./Configure no-tests linux-$GOARCH
          fi
          make clean && make all
          cd /workdir
          sed -i 's/^HAS_UNWIND.*/HAS_UNWIND := 0/' /workdir/src/Makefile
          export CFLAGS="-O2 -fPIC -ffunction-sections -fdata-sections -fomit-frame-pointer -fno-unwind-tables -fno-asynchronous-unwind-tables -I/workdir/openssl/include -Wno-error=date-time"
          export LDFLAGS="-L /workdir/openssl -Wl,-z,nocopyreloc"
          ./package/build-pkg.sh --platform openwrt --arch all --filearch $GOARCH-openwrt-openssl1.1.1 --outputdir /workdir/build
          ./package/build-pkg.sh --platform optware --arch all --filearch $GOARCH-optware-openssl1.1.1 --outputdir /workdir/build
          EOF
          docker run -i --rm -v ${{ github.workspace }}:/workdir alpine:3 sh /workdir/docker-openssl.sh
      - name: build-smartdns-openssl1.0.2
        run: |
          sudo timedatectl set-timezone "Asia/Shanghai"
          cd ${{ github.workspace }}
          mkdir -p ${{ github.workspace }}/build
          rm -rf ${{ github.workspace }}/openssl
          mkdir -p ${{ github.workspace }}/openssl
          tar -zxvf ./dependencies/openssl-1.0.2u.tar.gz --strip-components 1 -C openssl
          rm docker-openssl.sh || true
          cat >> docker-openssl.sh << EOF
          apk add perl make coreutils tar pkgconfig dpkg binutils autoconf zig
          mkdir -p /usr/local/zig/bin
          if [ "$GOARCH" == "armv7" ] || [ "$GOARCH" == "armv7l" ] ;then
            printf '#!/bin/sh\nexec zig cc -target arm-linux-musleabihf "\044@"\n' > /usr/local/zig/bin/gcc
            printf '#!/bin/sh\nexec zig c++ -target arm-linux-musleabihf "\044@"\n' > /usr/local/zig/bin/g++
          elif [ "$GOARCH" == "mips" ] ;then
            printf '#!/bin/sh\nexec zig cc -target mips-linux-musleabi  "\044@"\n' > /usr/local/zig/bin/gcc
            printf '#!/bin/sh\nexec zig c++ -target mips-linux-musleabi "\044@"\n' > /usr/local/zig/bin/g++
          elif [ "$GOARCH" == "mipsel" ] ;then
            printf '#!/bin/sh\nexec zig cc -target mipsel-linux-musleabi "\044@"\n' > /usr/local/zig/bin/gcc
            printf '#!/bin/sh\nexec zig c++ -target mipsel-linux-musleabi "\044@"\n' > /usr/local/zig/bin/g++
          elif [ "$GOARCH" == "mips-sf" ] ;then
            printf '#!/bin/sh\nexec zig cc -target mips-linux-musleabi -msoft-float "\044@"\n' > /usr/local/zig/bin/gcc
            printf '#!/bin/sh\nexec zig c++ -target mips-linux-musleabi -msoft-float "\044@"\n' > /usr/local/zig/bin/g++
          elif [ "$GOARCH" == "mipsel-sf" ] ;then
            printf '#!/bin/sh\nexec zig cc -target mipsel-linux-musleabi -msoft-float "\044@"\n' > /usr/local/zig/bin/gcc
            printf '#!/bin/sh\nexec zig c++ -target mipsel-linux-musleabi -msoft-float "\044@"\n' > /usr/local/zig/bin/g++
          elif [ "$GOARCH" == "i686" ] ;then
            printf '#!/bin/sh\nexec zig cc -target x86-linux-musl "\044@"\n' > /usr/local/zig/bin/gcc
            printf '#!/bin/sh\nexec zig c++ -target x86-linux-musl "\044@"\n' > /usr/local/zig/bin/g++
          else
            printf '#!/bin/sh\nexec zig cc -target $GOARCH-linux-musl "\044@"\n' > /usr/local/zig/bin/gcc
            printf '#!/bin/sh\nexec zig c++ -target $GOARCH-linux-musl "\044@"\n' > /usr/local/zig/bin/g++
          fi
          cp /usr/local/zig/bin/gcc /usr/local/zig/bin/cc
          cp /usr/local/zig/bin/gcc /usr/local/zig/bin/clang
          cp /usr/local/zig/bin/g++ /usr/local/zig/bin/c++
          cp /usr/local/zig/bin/g++ /usr/local/zig/bin/clang++
          printf '#!/bin/sh\nexec zig ar "\044@"\n' > /usr/local/zig/bin/ar
          chmod +x /usr/local/zig/bin/*
          export PATH=/usr/local/zig/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          export CC=gcc
          cd /workdir/openssl
          if [ "$GOARCH" == "mipsel" ] || [ "$GOARCH" == "mips" ] || [ "$GOARCH" == "mips-sf" ] || [ "$GOARCH" == "mipsel-sf" ] ;then
            ./Configure linux-mips32 no-asm shared
          elif [ "$GOARCH" == "mips64el" ] || [ "$GOARCH" == "mips64" ] ;then
            ./Configure linux-mips64
          elif [ "$GOARCH" == "i686" ] ;then
            ./Configure linux-elf
          elif [ "$GOARCH" == "powerpc64le" ] ;then
            ./Configure linux-ppc64le
          elif [ "$GOARCH" == "armv7" ] || [ "$GOARCH" == "armv7l" ] ;then
            ./Configure linux-armv4 no-asm shared
          else
            ./Configure linux-$GOARCH
          fi
          make clean && make all
          cd /workdir
          sed -i 's/^HAS_UNWIND.*/HAS_UNWIND := 0/' /workdir/src/Makefile
          export CFLAGS="-O2 -fPIC -ffunction-sections -fdata-sections -fomit-frame-pointer -fno-unwind-tables -fno-asynchronous-unwind-tables -I/workdir/openssl/include -Wno-error=date-time"
          export LDFLAGS="-L /workdir/openssl -Wl,-z,nocopyreloc"
          ./package/build-pkg.sh --platform openwrt --arch all --filearch $GOARCH-openwrt-openssl1.0.2 --outputdir /workdir/build
          ./package/build-pkg.sh --platform optware --arch all --filearch $GOARCH-optware-openssl1.0.2 --outputdir /workdir/build
          EOF
          docker run -i --rm -v ${{ github.workspace }}:/workdir alpine:3 sh /workdir/docker-openssl.sh

      - name: general tag and release ipk
        id: tag
        run: |
          cd ${{ github.workspace }}
          echo "release_tag=${{needs.get-version.outputs.CUR_VERSION}}-openssl1-canary" >> $GITHUB_OUTPUT
          touch release.txt
          echo "包含一些上游未合并的更新" >> release.txt
          echo ${{ github.sha }} >> release.txt
          echo "status=success" >> $GITHUB_OUTPUT
      - name: Upload firmware to release
        uses: softprops/action-gh-release@v1
        if: steps.tag.outputs.status == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          files: |
            ${{ github.workspace }}/build/*
